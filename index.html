<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤·카드 스튜디오 — 이미지 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>짤·카드 스튜디오</h1>
  <p class="sub">이미지와 문구를 조합해 밈·카드·SNS 게시용 이미지를 만들고 PNG로 저장하세요.</p>
</header>

<main class="layout">

  <section class="panel" aria-label="편집 도구">
    <div class="group">
      <h2>1. 이미지 · 배경</h2>
      <label class="file-label" id="drop-zone">
        <input type="file" id="image-input" accept="image/png, image/jpeg">
        <span>이미지 불러오기 또는 끌어다 놓기 (PNG / JPEG · Ctrl+V)</span>
      </label>
      <p class="hint" id="image-error" role="alert" hidden></p>

      <div class="sub-controls">
        <div class="field-row">
          <span class="field-label">이미지 배치</span>
          <div class="seg-group" role="group" aria-label="이미지 배치 방식">
            <button type="button" class="seg-btn" data-fit="cover" aria-pressed="true">꽉 채우기 (Cover)</button>
            <button type="button" class="seg-btn" data-fit="contain" aria-pressed="false">전체 맞춤 (Contain)</button>
          </div>
          <button type="button" class="btn ghost sm" id="image-clear">이미지 비우기</button>
        </div>

        <div class="field-row">
          <label class="check-label">
            <input type="checkbox" id="bg-fill-check" checked>
            <span>단색 배경 채우기</span>
          </label>
          <input type="color" id="bg-color-input" value="#1e293b" aria-label="배경 색상">
        </div>

        <label class="field">
          <span>배경 어둡게 (딤 오버레이) <output id="dim-out">0</output>%</span>
          <input type="range" id="dim-range" min="0" max="80" step="5" value="0">
        </label>
      </div>
    </div>

    <div class="group">
      <h2>2. 비율</h2>
      <div class="ratio-group" role="group" aria-label="비율 선택">
        <button type="button" class="ratio-btn" data-ratio="1:1" aria-pressed="true">1:1 (정방형)</button>
        <button type="button" class="ratio-btn" data-ratio="4:5" aria-pressed="false">4:5 (카드뉴스)</button>
        <button type="button" class="ratio-btn" data-ratio="9:16" aria-pressed="false">9:16 (릴스·스토리)</button>
      </div>
    </div>

    <div class="group">
      <h2>3. 문구 · 스타일</h2>
      <label class="field">
        <span>주 문구 (엔터로 줄바꿈 가능)</span>
        <textarea id="text-input" rows="2" maxlength="200">안녕하세요</textarea>
      </label>

      <div class="emoji-bar" aria-label="이모지 빠른 삽입">
        <span class="emoji-label">이모지</span>
        <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
        <button type="button" class="emoji-btn" data-emoji="🔥">🔥</button>
        <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
        <button type="button" class="emoji-btn" data-emoji="💡">💡</button>
        <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
        <button type="button" class="emoji-btn" data-emoji="📢">📢</button>
        <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
      </div>

      <label class="field">
        <span>폰트</span>
        <select id="font-select">
          <option value="'Gaegu', sans-serif">개구쟁이 (손글씨)</option>
          <option value="'Gamja Flower', sans-serif">감자꽃 (손글씨)</option>
          <option value="'Jua', sans-serif">주아 (귀여운)</option>
          <option value="'Do Hyeon', sans-serif">도현 (추천)</option>
          <option value="sans-serif">기본 (산세리프)</option>
          <option value="serif">명조 (serif)</option>
          <option value="monospace">고정폭 (monospace)</option>
          <option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
          <option value="'Apple SD Gothic Neo', sans-serif">Apple SD 고딕</option>
          <option value="'Gulim', sans-serif">굴림</option>
          <option value="'Batang', serif">바탕</option>
          <option value="'Arial', sans-serif">Arial</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Verdana', sans-serif">Verdana</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Impact', sans-serif">Impact</option>
          <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
          <option value="'Segoe Script', cursive">Segoe Script</option>
          <option value="'Lucida Handwriting', cursive">Lucida Handwriting</option>
          <option value="'Brush Script MT', cursive">Brush Script MT</option>
        </select>
      </label>

      <div class="field">
        <span>문구 정렬</span>
        <div class="seg-group" role="group" aria-label="문구 정렬">
          <button type="button" class="align-btn" data-align="left" aria-pressed="false">왼쪽</button>
          <button type="button" class="align-btn" data-align="center" aria-pressed="true">가운데</button>
          <button type="button" class="align-btn" data-align="right" aria-pressed="false">오른쪽</button>
        </div>
      </div>

      <div class="grid-2">
        <label class="field">
          <span>X 위치 <output id="x-out">0.50</output></span>
          <input type="range" id="x-range" min="0" max="1" step="0.01" value="0.5">
        </label>
        <label class="field">
          <span>Y 위치 <output id="y-out">0.80</output></span>
          <input type="range" id="y-range" min="0" max="1" step="0.01" value="0.8">
        </label>
      </div>

      <label class="field">
        <span>글자 크기 <output id="size-out">64</output>px</span>
        <input type="range" id="size-range" min="12" max="200" step="1" value="64">
      </label>

      <div class="style-box">
        <div class="field-row">
          <label class="color-pair">
            <span>글자 색</span>
            <input type="color" id="color-input" value="#ffffff">
          </label>
          <label class="color-pair">
            <span>외곽선 색</span>
            <input type="color" id="stroke-color" value="#000000">
          </label>
        </div>

        <label class="field">
          <span>외곽선 두께 (짤방 테두리) <output id="stroke-out">6</output>px</span>
          <input type="range" id="stroke-range" min="0" max="24" step="1" value="6">
        </label>

        <div class="field-row">
          <label class="check-label">
            <input type="checkbox" id="bg-box-check">
            <span>반투명 자막 바</span>
          </label>
          <label class="check-label">
            <input type="checkbox" id="shadow-check" checked>
            <span>글자 그림자</span>
          </label>
        </div>
      </div>

      <div class="subtext-box">
        <label class="field">
          <span>보조 문구 (상단 제목 / 부제목 — 비워두면 숨김)</span>
          <input type="text" id="subtext-input" value="" maxlength="150" placeholder="예: 오늘의 유머 / CARD NEWS">
        </label>
        <div class="grid-2">
          <label class="field">
            <span>보조 Y 위치 <output id="sub-y-out">0.15</output></span>
            <input type="range" id="sub-y-range" min="0" max="1" step="0.01" value="0.15">
          </label>
          <label class="field">
            <span>보조 크기 <output id="sub-size-out">40</output>px</span>
            <input type="range" id="sub-size-range" min="12" max="140" step="1" value="40">
          </label>
        </div>
      </div>
    </div>

    <div class="group">
      <h2>4. 템플릿</h2>
      <label class="field">
        <span>템플릿 이름</span>
        <input type="text" id="tpl-name" maxlength="40" placeholder="예: 여름 세일 / 밈 자막">
      </label>
      <div class="btn-row">
        <button type="button" class="btn" id="tpl-save">저장</button>
        <button type="button" class="btn ghost" id="tpl-presets">기본 샘플 추가</button>
        <button type="button" class="btn ghost" id="json-export">JSON 내보내기</button>
        <label class="btn ghost file-inline">
          <input type="file" id="json-import" accept="application/json,.json">
          <span>JSON 가져오기</span>
        </label>
      </div>
      <p class="hint" id="tpl-msg" role="alert" hidden></p>
      <ul class="tpl-list" id="tpl-list" aria-label="템플릿 목록"></ul>
    </div>
  </section>

  <section class="preview" aria-label="미리보기">
    <div class="preview-head">
      <span class="badge-tip">캔버스에서 문구를 마우스로 직접 드래그해 위치를 옮길 수 있습니다</span>
    </div>
    <div class="canvas-wrap" id="canvas-drop-zone">
      <canvas id="canvas" width="1080" height="1080" aria-label="편집 미리보기 캔버스"></canvas>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="download">PNG 다운로드</button>
    </div>
    <p class="hint">미리보기와 저장 파일은 동일한 캔버스를 사용합니다. 이미지를 캔버스에 바로 드롭하거나 Ctrl+V로 붙여넣을 수 있습니다.</p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
